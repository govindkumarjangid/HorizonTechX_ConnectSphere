name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        env:
          TARGET_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
        run: |
          if [ -n "$TARGET_URL" ]; then
            CLEAN_URL=$(echo "$TARGET_URL" | sed 's:/*$::')
            echo "Pinging $CLEAN_URL/api/health"
            curl -sS --max-time 60 "$CLEAN_URL/api/health" || true
          else
            echo "BACKEND_URL secret or variable is not set. Skipping ping."
          fi
